[project]
name = "agentweather"
version = "0.1.0"
description = "Agentic multi-metric weather and air quality forecasting system for Islamabad"
authors = [
    { name = "Abdullah Ahmad", email = "abdullahahmad10004@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.16.2",
    "deltalake>=1.6.6",
    "hopsworks==5.2.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.15.0",
]

[tool.uv]
package = false
